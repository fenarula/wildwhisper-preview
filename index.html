<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex, nofollow">
<title>Wildwhisper — internal phone test</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0f0c;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  /* the canvas sits inside the safe area (notch / rounded corners / home indicator) so Unity's Screen = the safe area */
  #unity-container { position: fixed; top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
    left: env(safe-area-inset-left); right: env(safe-area-inset-right); }
  #unity-canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; background: #0b0f0c; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #eef3e8; font: 600 20px/1.4 -apple-system, system-ui, sans-serif; text-align: center; background: rgba(8,12,9,.92); z-index: 10; }
  #start .big { font-size: 30px; margin: 10px; padding: 18px 34px; border-radius: 16px; background: #2f5d3a; border: 2px solid #8fc79a; }
  #start small, #rotate small { font-weight: 400; opacity: .75; font-size: 15px; max-width: 80vw; }
  #bar { width: 60vw; max-width: 420px; height: 10px; background: #233; border-radius: 6px; overflow: hidden; margin-top: 16px; }
  #bar > div { width: 0; height: 100%; background: #8fc79a; }
  #rotate { display: none; z-index: 20; }
  @media (orientation: portrait) { #rotate.active { display: flex; } }
  #err { color: #ffb4a8; font-size: 15px; max-width: 86vw; }
</style>
</head>
<body>
<div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="start" class="overlay">
  <div>Wildwhisper</div>
  <div id="status">Loading…</div>
  <div id="bar"><div></div></div>
  <div id="go" class="big" style="display:none">Tap to play</div>
  <small>Internal test build — landscape, sound on. Left thumb: move · right side: look · buttons on the right.</small>
  <div id="err"></div>
</div>
<div id="rotate" class="overlay active">
  <div style="font-size:48px">⟲</div>
  <div>Rotate your phone to landscape</div>
  <small>Wildwhisper plays in landscape.</small>
</div>
<script>
(function () {
  // ---- no page scroll / pinch-zoom / double-tap-zoom / long-press menu hijacking (Unity still gets every touch)
  var block = function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); };
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchstart', block, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
  var lastEnd = 0;
  document.addEventListener('touchend', function (e) { var now = Date.now(); if (now - lastEnd < 350) e.preventDefault(); lastEnd = now; }, { passive: false });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  window.addEventListener('scroll', function () { window.scrollTo(0, 0); });

  // ---- touch wiring counters (QA: headless check reads window.__wwTouch)
  window.__wwTouch = { start: 0, move: 0, end: 0, canvasStart: 0 };
  document.addEventListener('touchstart', function () { window.__wwTouch.start++; }, { passive: true, capture: true });
  document.addEventListener('touchmove', function () { window.__wwTouch.move++; }, { passive: true, capture: true });
  document.addEventListener('touchend', function () { window.__wwTouch.end++; }, { passive: true, capture: true });

  var canvas = document.getElementById('unity-canvas');
  canvas.addEventListener('touchstart', function () { window.__wwTouch.canvasStart++; }, { passive: true });
  var startEl = document.getElementById('start'), go = document.getElementById('go'), status = document.getElementById('status');
  var bar = document.querySelector('#bar > div'), err = document.getElementById('err'), rotate = document.getElementById('rotate');
  var instance = null;

  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  if (!isMobile) rotate.classList.remove('active');

  // ---- audio unlock on the first tap (iOS keeps Web Audio suspended until a user gesture)
  var unlocked = false;
  function unlockAudio() {
    if (unlocked) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { var ctx = new AC(); var b = ctx.createBuffer(1, 1, 22050); var s = ctx.createBufferSource(); s.buffer = b; s.connect(ctx.destination); s.start(0); ctx.resume && ctx.resume(); }
      var wa = instance && instance.Module && instance.Module.WEBAudio;
      if (wa && wa.audioContext && wa.audioContext.state !== 'running') wa.audioContext.resume();
      unlocked = true; window.__wwAudioUnlocked = true;
    } catch (e) { console.warn('audio unlock', e); }
  }
  document.addEventListener('touchend', unlockAudio, { passive: true });
  document.addEventListener('pointerup', unlockAudio, { passive: true });

  function goFullscreen() {
    var el = document.documentElement;
    var rq = el.requestFullscreen || el.webkitRequestFullscreen;
    try {
      if (rq && !document.fullscreenElement && !document.webkitFullscreenElement) {
        var p = rq.call(el, { navigationUI: 'hide' });
        if (p && p.then) p.then(lockLandscape).catch(function () {});
      } else lockLandscape();
    } catch (e) { }
  }
  function lockLandscape() { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); } catch (e) { } }

  go.addEventListener('click', function () {
    unlockAudio(); goFullscreen();
    startEl.style.display = 'none'; window.__wwStarted = true;
    canvas.focus();
  });

  var buildUrl = 'Build';
  var config = {
    dataUrl: buildUrl + '/webgl_phone.data',
    frameworkUrl: buildUrl + '/webgl_phone.framework.js',
    codeUrl: buildUrl + '/webgl_phone.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: "Game Studio",
    productName: "Wildwhisper",
    productVersion: "0.1.0",
    matchWebGLToCanvasSize: true,
    // phones: cap the backbuffer at 2× CSS pixels (Low tier; keeps fill-rate and memory sane on 3× screens)
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    showBanner: function (msg, type) { if (type === 'error') err.textContent = msg; console.log('[unity]', type, msg); },
  };
  var script = document.createElement('script');
  script.src = buildUrl + '/webgl_phone.loader.js';
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) { bar.style.width = Math.round(p * 100) + '%'; status.textContent = 'Loading… ' + Math.round(p * 100) + '%'; })
      .then(function (u) { instance = u; window.__wwUnity = u; status.textContent = 'Ready'; go.style.display = 'block'; window.__wwLoaded = true; })
      .catch(function (m) { err.textContent = 'Could not start: ' + m; window.__wwError = String(m); });
  };
  script.onerror = function () { err.textContent = 'Could not load the game files.'; };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
